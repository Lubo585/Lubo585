# Supabase CLI – lokálna konfigurácia projektu (supabase init by vytvoril podobný súbor)
project_id = "nazovportalu"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 17

[auth]
site_url = "https://nazovportalu.sk"
additional_redirect_urls = ["http://localhost:8080"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.payment-webhook]
verify_jwt = false
