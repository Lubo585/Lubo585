name: Deploy Jadran Hills (FTP)

# Zostaví verejný web Jadran Hills (prezentačná stránka + CRM pod /crm/) a nahrá ho
# na hosting cez FTP/FTPS. Kým nie sú nastavené údaje hostingu, nasadenie sa preskočí.
# Potrebné GitHub Secrets (Settings → Secrets and variables → Actions):
#   JH_FTP_SERVER    – adresa FTP servera od hostingu
#   JH_FTP_USERNAME  – FTP používateľ
#   JH_FTP_PASSWORD  – FTP heslo
#   JH_FTP_DIR       – cieľový priečinok, napr. /web/ alebo /public_html/ (voliteľné, predvolené /)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['jadran-hills-crm/**']

concurrency:
  group: jadran-hills
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP secrets
        id: cfg
        run: |
          if [ -z "${{ secrets.JH_FTP_SERVER }}" ]; then
            echo "FTP secrets nie sú nastavené – nasadenie preskočené."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jadran-hills-crm/package-lock.json
      - run: npm ci
        if: steps.cfg.outputs.ok == 'true'
        working-directory: jadran-hills-crm
      - run: npm test
        if: steps.cfg.outputs.ok == 'true'
        working-directory: jadran-hills-crm
      - run: npm run build:web
        if: steps.cfg.outputs.ok == 'true'
        working-directory: jadran-hills-crm
      - name: Upload via FTP
        if: steps.cfg.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.JH_FTP_SERVER }}
          username: ${{ secrets.JH_FTP_USERNAME }}
          password: ${{ secrets.JH_FTP_PASSWORD }}
          protocol: ftps
          local-dir: jadran-hills-crm/dist-web/
          server-dir: ${{ secrets.JH_FTP_DIR || '/' }}
