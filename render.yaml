# Nasadenie na Render.com jedným kliknutím – OSTRÁ PREVÁDZKA
# Plán "starter" s trvalým diskom (dáta ostávajú pri reštarte aj aktualizácii). Cena cca 7 USD/mes. + disk.
# Pre bezplatné vyskúšanie zmeňte plan: free, odstráňte sekciu disk a nastavte DEMO_SEED na "1" (dáta sú potom dočasné).
services:
  - type: web
    name: sxworkforce
    runtime: node
    plan: starter
    region: frankfurt
    branch: claude/determined-mccarthy-7jfplr
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: DB_PATH
        value: /opt/render/project/src/data/app.db
      - key: UPLOAD_DIR
        value: /opt/render/project/src/data/uploads
      - key: DEMO_SEED
        value: "0"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
