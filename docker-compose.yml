# Nasadenie na internet: aplikácia + Caddy (automatické HTTPS certifikáty Let's Encrypt)
# 1. do .env nastavte DOMAIN=app.vasafirma.sk, SESSION_SECRET=nahodny-retazec, ADMIN_PASSWORD=...
# 2. DNS záznam domény nasmerujte na server
# 3. docker compose up -d
# Aktualizácia: git pull && docker compose up -d --build   (dáta v ./data ostávajú, pred migráciou sa vytvorí záloha)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/app.db
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
