name: Deploy to Websupport (pspsk.de)

# Spúšťa sa len ručne (Actions → Run workflow), kým Websupport hosting nie je
# sprevádzkovaný a kým v repozitári nie sú secrets FTP_SERVER/FTP_USERNAME/FTP_PASSWORD.
on:
  workflow_dispatch:

concurrency:
  group: websupport
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist/ to Websupport webhosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: 21
          local-dir: ./dist/
          server-dir: /web/
          exclude: |
            **/.git*
            **/.git*/**
